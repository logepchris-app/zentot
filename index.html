<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenTot | Travel around the nap</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-emerald-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const LandingPage = () => {
            const [email, setEmail] = useState('');
            const [submitted, setSubmitted] = useState(false);
            
            // Countdown State
            const [timeLeft, setTimeLeft] = useState({
                days: 0, hours: 0, minutes: 0, seconds: 0
            });

            // Target Date: August 30, 2026
            const targetDate = new Date('2026-08-30T00:00:00');

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    const difference = targetDate - now;

                    if (difference > 0) {
                        setTimeLeft({
                            days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((difference / (1000 * 60 * 60)) % 24),
                            minutes: Math.floor((difference / 1000 / 60) % 60),
                            seconds: Math.floor((difference / 1000) % 60)
                        });
                    } else {
                        clearInterval(timer);
                    }
                }, 1000);

                return () => clearInterval(timer);
            }, []);

            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
                setEmail('');
            };

            return (
                <div className="min-h-screen font-sans text-gray-800">
                  {/* Header */}
                  <header className="bg-white shadow-sm p-6 flex justify-between items-center">
                    <div className="flex items-baseline gap-2">
                      <div className="text-3xl font-extrabold text-emerald-600 tracking-tight">
                        ZenTot
                      </div>
                      <div className="hidden sm:block text-sm font-medium text-gray-400">
                        Take your nap when someone else plans your trip.
                      </div>
                    </div>
                  </header>

                  {/* Hero Section */}
                  <section className="bg-emerald-50 py-20 px-6 text-center">
                    <div className="max-w-4xl mx-auto">
                      
                      {/* Countdown Timer */}
                      <div className="mb-12 inline-block bg-white p-6 rounded-2xl shadow-sm border border-emerald-100">
                        <p className="text-sm font-bold text-emerald-600 uppercase tracking-widest mb-4">Beta Launch In</p>
                        <div className="flex gap-4 sm:gap-8 justify-center text-left">
                           <div className="flex flex-col items-center"><span className="text-4xl sm:text-5xl font-black text-gray-900">{timeLeft.days}</span><span className="text-xs text-gray-500 mt-1 uppercase">Days</span></div>
                           <div className="text-3xl sm:text-4xl font-light text-gray-300 mt-1">:</div>
                           <div className="flex flex-col items-center"><span className="text-4xl sm:text-5xl font-black text-gray-900">{timeLeft.hours}</span><span className="text-xs text-gray-500 mt-1 uppercase">Hours</span></div>
                           <div className="text-3xl sm:text-4xl font-light text-gray-300 mt-1">:</div>
                           <div className="flex flex-col items-center"><span className="text-4xl sm:text-5xl font-black text-gray-900">{timeLeft.minutes}</span><span className="text-xs text-gray-500 mt-1 uppercase">Mins</span></div>
                           <div className="text-3xl sm:text-4xl font-light text-gray-300 mt-1">:</div>
                           <div className="flex flex-col items-center"><span className="text-4xl sm:text-5xl font-black text-emerald-600">{timeLeft.seconds}</span><span className="text-xs text-gray-500 mt-1 uppercase">Secs</span></div>
                        </div>
                      </div>

                      <h1 className="text-5xl md:text-7xl font-black text-gray-900 leading-tight mb-6">
                        Take your <span className="text-emerald-600">nap</span> when someone else plans your trip.
                      </h1>
                      <p className="text-xl text-gray-700 mb-10 leading-relaxed max-w-2xl mx-auto">
                        Plan the perfect family trip in minutes. Discover stroller-friendly routes, kid-approved activities, and AI itineraries designed entirely around your toddler's schedule.
                      </p>
                      
                      {!submitted ? (
                          <form onSubmit={handleSubmit} className="flex flex-col sm:flex-row justify-center max-w-lg mx-auto gap-3 bg-white p-2 rounded-lg shadow-md border border-emerald-100">
                            <input 
                              type="email" 
                              placeholder="Your email address..." 
                              required
                              value={email}
                              onChange={(e) => setEmail(e.target.value)}
                              className="w-full px-4 py-3 outline-none rounded-md text-gray-700 bg-transparent"
                            />
                            <button 
                              type="submit" 
                              className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-md transition-colors w-full sm:w-auto whitespace-nowrap shadow-sm"
                            >
                              Get Early Access
                            </button>
                          </form>
                      ) : (
                          <div className="bg-emerald-100 border border-emerald-200 text-emerald-800 px-6 py-4 rounded-lg max-w-lg mx-auto font-medium">
                              🎉 Thank you! You've been added to the waitlist.
                          </div>
                      )}
                      
                      <p className="text-sm text-gray-500 mt-4">Join the waitlist for free Beta access.</p>
                    </div>
                  </section>

                  {/* Features Section */}
                  <section id="features" className="py-20 px-6 bg-white">
                    <div className="max-w-6xl mx-auto">
                      <div className="grid md:grid-cols-3 gap-12">
                        {/* Feature 1 */}
                        <div className="text-center p-8 rounded-2xl bg-emerald-50/50 hover:shadow-lg transition-shadow border border-emerald-100">
                          <div className="text-5xl mb-6">🗺️</div>
                          <h3 className="text-xl font-bold mb-3 text-gray-900">Stroller-Friendly Maps</h3>
                          <p className="text-gray-600 text-base leading-relaxed">
                            Navigate with confidence. Instantly find step-free routes, restaurants equipped with high chairs, and clean changing facilities around you.
                          </p>
                        </div>

                        {/* Feature 2 */}
                        <div className="text-center p-8 rounded-2xl bg-emerald-50/50 hover:shadow-lg transition-shadow border border-emerald-100">
                          <div className="text-5xl mb-6">⏰</div>
                          <h3 className="text-xl font-bold mb-3 text-gray-900">Smart AI Itineraries</h3>
                          <p className="text-gray-600 text-base leading-relaxed">
                            Input your child's sleep schedule. Our AI automatically builds a daily plan that protects their routine, ensuring everyone stays energized.
                          </p>
                        </div>

                        {/* Feature 3 */}
                        <div className="text-center p-8 rounded-2xl bg-emerald-50/50 hover:shadow-lg transition-shadow border border-emerald-100">
                          <div className="text-5xl mb-6">🚇</div>
                          <h3 className="text-xl font-bold mb-3 text-gray-900">Seamless Transit</h3>
                          <p className="text-gray-600 text-base leading-relaxed">
                            Optimize your movement. We schedule longer public transit rides or stroller walks exactly when your toddler usually naps, turning travel time into rest time.
                          </p>
                        </div>
                      </div>
                    </div>
                  </section>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LandingPage />);
    </script>
</body>
</html>
